spring.application.name=cadastrar_Veiculos
server.port=8080

# 2. Configuração do Banco de Dados H2 em Memória
spring.datasource.url=jdbc:h2:mem:veiculosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root

# 3. Habilitar o Console Visual do H2 no Navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 4. Configurações do Hibernate / JPA
# update: cria e atualiza as tabelas automaticamente sem apagar dados a cada reload
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

